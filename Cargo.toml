[workspace]
resolver = "3"
members = ["cli", "codegen", "lib"]

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.6.9"
governor = "0.10.4"
paste = "1.0.15"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.4"
